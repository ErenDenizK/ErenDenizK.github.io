<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og contact sheet</title>
<!-- Generic mock frames: sizes follow the research (docs/research/2026-10-link-previews.md),
     colours and chrome are neutral so no product is imitated. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #d9d9db; font-family: "Inter", sans-serif; color: #1b1b1d; -webkit-font-smoothing: antialiased; }
  #root { padding: 40px; display: flex; flex-direction: column; gap: 40px; width: max-content; }
  h2 { font: 600 20px/1.2 "Inter"; letter-spacing: -0.01em; }
  .lab { font: 400 13px/1.35 "Inter"; color: #55555a; margin-top: 8px; }
  .row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: nowrap; }
  .fig img { display: block; }
  .full img { width: 1200px; height: 630px; }
  .half img { width: 600px; height: 315px; }

  /* chat bubbles */
  .chat { padding: 18px; border-radius: 16px; width: max-content; }
  .chat.dark { background: #121214; }
  .chat.light { background: #ffffff; }
  .bubble { border-radius: 14px; overflow: hidden; }
  .dark .bubble { background: #2a2b2f; color: #e8e8ea; }
  .light .bubble { background: #e9e9eb; color: #111; }
  .bubble img { width: 100%; display: block; aspect-ratio: 1200 / 630; object-fit: cover; }
  .bubble .t { font: 600 14px/1.3 "Inter"; padding: 8px 10px 0; }
  .bubble .d { font: 400 12px/1.3 "Inter"; padding: 2px 10px 0; opacity: 0.7; }
  .bubble .h { font: 400 12px/1.3 "Inter"; padding: 2px 10px 9px; opacity: 0.55; }
  /* small: square thumbnail beside the text */
  .bubble.small { display: flex; gap: 0; align-items: stretch; }
  .bubble.small img { width: 84px; height: 84px; aspect-ratio: 1; flex: none; object-fit: cover; }
  .bubble.small .tx { padding: 2px 0; min-width: 0; }

  /* generic social post (feed width 555px) */
  .post { width: 555px; background: #fff; border-radius: 10px; padding: 14px 0 10px; box-shadow: 0 0 0 1px #0000000f; }
  .post .who { display: flex; gap: 10px; padding: 0 16px; align-items: center; }
  .post .av { width: 48px; height: 48px; border-radius: 50%; background: #c8c8cc center/cover; flex: none; }
  .post .n { font: 600 14px/1.25 "Inter"; }
  .post .s { font: 400 12px/1.3 "Inter"; color: #666; }
  .post .body { font: 400 14px/1.45 "Inter"; padding: 10px 16px 12px; color: #222; }
  .post .card { border-top: 1px solid #e6e6e6; border-bottom: 1px solid #e6e6e6; }
  .post .card img { width: 100%; display: block; aspect-ratio: 1200 / 627; object-fit: cover; }
  .post .card .meta { padding: 10px 16px; background: #f3f3f4; }
  .post .card .t { font: 600 14px/1.3 "Inter"; color: #111; }
  .post .card .h { font: 400 12px/1.3 "Inter"; color: #666; margin-top: 2px; }
  .post .card.small { display: flex; margin: 0 16px; border: 1px solid #e6e6e6; border-radius: 8px; overflow: hidden; }
  .post .card.small img { width: 136px; flex: none; }
  .post .card.small .meta { background: #fff; display: flex; flex-direction: column; justify-content: center; }
  .post .bar { height: 30px; margin: 10px 16px 0; border-top: 1px solid #ececec; }
  .thumb { border-radius: 6px; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const img = (src, w, h, style) => { const i = el('img'); i.src = src; if (w) i.style.width = w + 'px'; if (h) i.style.height = h + 'px'; if (style) Object.assign(i.style, style); return i; };
const fig = (node, label, cls) => { const f = el('div', 'fig ' + (cls || '')); f.append(node, el('p', 'lab', label)); return f; };

function bubble(c, w, theme, small) {
  const wrap = el('div', 'chat ' + theme);
  const b = el('div', 'bubble' + (small ? ' small' : ''));
  b.style.width = w + 'px';
  const tx = el('div', 'tx');
  tx.append(el('p', 't', c.ogTitle), el('p', 'd', c.ogDescription), el('p', 'h', c.host));
  b.append(img(c.src), tx);
  wrap.append(b);
  return wrap;
}

function post(c, small, avatar) {
  const p = el('div', 'post');
  const who = el('div', 'who');
  const av = el('div', 'av'); if (avatar) av.style.backgroundImage = `url(${avatar})`;
  const id = el('div'); id.append(el('p', 'n', 'Eren Deniz Kuyucaklıoğlu'), el('p', 's', 'Computer Engineering student'));
  who.append(av, id);
  const card = el('div', 'card' + (small ? ' small' : ''));
  const meta = el('div', 'meta'); meta.append(el('p', 't', c.ogTitle), el('p', 'h', c.host));
  card.append(img(c.src), meta);
  p.append(who, el('p', 'body', c.postText), card, el('div', 'bar'));
  return p;
}

// Centre square crop, as clients that show a square thumbnail do.
function square(c, s) {
  const d = el('div', 'thumb'); d.style.width = d.style.height = s + 'px';
  d.append(img(c.src, s, s, { objectFit: 'cover', width: s + 'px', height: s + 'px' }));
  return d;
}

const views = {
  // One card: full size, chat sizes, crops and two post frames.
  card(root, c, opt) {
    root.append(el('h2', null, c.id + ' — ' + c.bytes));
    root.append(fig(img(c.src), 'Full size, 1200 × 630', 'full'));
    const r1 = el('div', 'row');
    r1.append(
      fig(bubble(c, 300, 'dark'), 'Chat, dark, 300 px (phone bubble)'),
      fig(bubble(c, 260, 'light'), 'Chat, light, 260 px'),
      fig(img(c.src, 400, 210), '400 px wide'),
      fig(img(c.src, 160, 84), 'Small thumbnail, 160 px'),
      fig(square(c, 96), 'Square centre crop, 96 px'),
    );
    root.append(r1);
    const r2 = el('div', 'row');
    r2.append(fig(post(c, false, opt.avatar), 'Post frame, large card (555 px)'),
      fig(post(c, true, opt.avatar), 'Post frame, small thumbnail'),
      fig(bubble(c, 300, 'dark', true), 'Chat, small layout: square thumbnail'));
    root.append(r2);
  },
  // Overview A: every card at half size.
  grid(root, cards) {
    root.append(el('h2', null, 'Link-preview cards, half size (600 × 315)'));
    for (let i = 0; i < cards.length; i += 2) {
      const r = el('div', 'row');
      cards.slice(i, i + 2).forEach((c) => r.append(fig(img(c.src), `${c.id} · ${c.bytes}`, 'half')));
      root.append(r);
    }
  },
  // Overview B: the sizes people actually see in chats.
  chat(root, cards) {
    root.append(el('h2', null, 'At chat size: 300 px bubble, 160 px thumbnail, 96 px square crop'));
    for (const c of cards) {
      const r = el('div', 'row');
      r.append(fig(bubble(c, 300, 'dark'), c.id), fig(img(c.src, 160, 84), '160 px'), fig(square(c, 96), 'square'), fig(bubble(c, 280, 'dark', true), 'small layout'));
      root.append(r);
    }
  },
  // Overview C: post frames for a few cards.
  posts(root, cards, opt) {
    root.append(el('h2', null, 'In a feed post: large card and small thumbnail'));
    for (const c of cards) {
      const r = el('div', 'row');
      r.append(fig(post(c, false, opt.avatar), c.id + ', large card'), fig(post(c, true, opt.avatar), c.id + ', small thumbnail'));
      root.append(r);
    }
  },
};

// Icon candidates: touch icon, maskable with its 80% safe circle, favicons at 1× and 4×,
// and the 16 px favicon in a dark and a light tab strip.
views.icons = (root, list) => {
  root.append(el('h2', null, 'edk icon candidates'));
  for (const v of list) {
    const r = el('div', 'row');
    const p = (n) => `${v.base}/${v.name}-${n}.png`;
    r.append(fig(img(p('apple-touch-icon-180'), 180, 180, { borderRadius: '40px' }), 'apple-touch-icon 180 (iOS rounds it)'));
    const mk = el('div'); mk.style.cssText = 'position:relative;width:256px;height:256px';
    const ring = el('div'); ring.style.cssText = 'position:absolute;inset:25.6px;border-radius:50%;box-shadow:0 0 0 1px #ff4d4d';
    mk.append(img(p('maskable-512'), 256, 256), ring);
    r.append(fig(mk, 'maskable 512, 80% circle in red'));
    for (const s of [16, 32, 48]) r.append(fig(img(p('favicon-' + s), s, s), s + ' px'));
    for (const s of [16, 32]) r.append(fig(img(p('favicon-' + s), s * 4, s * 4, { imageRendering: 'pixelated' }), s + ' px at 4×'));
    const tabs = el('div');
    for (const bg of ['#202124', '#f1f1f3']) {
      const t = el('div'); t.style.cssText = `display:flex;gap:8px;align-items:center;width:220px;height:34px;padding:0 10px;margin-bottom:6px;border-radius:8px;background:${bg};color:${bg === '#202124' ? '#e8e8ea' : '#222'};font:400 12px Inter`;
      t.append(img(p('favicon-16'), 16, 16), 'Eren Deniz Kuyucaklıoğlu');
      tabs.append(t);
    }
    r.append(fig(tabs, v.name + ': browser tab, dark and light'));
    root.append(r);
  }
};

window.sheet = async (view, payload, opt) => {
  const root = document.getElementById('root');
  root.replaceChildren();
  views[view](root, payload, opt || {});
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  const r = root.getBoundingClientRect();
  return { w: Math.ceil(r.width), h: Math.ceil(r.height) };
};
</script>
</body>
</html>
