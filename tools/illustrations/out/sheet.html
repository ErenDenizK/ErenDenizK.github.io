<!doctype html><meta charset="utf-8"><title>Illustration kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Newsreader:opsz,wght@6..72,400..500&display=swap">
<style>:root{color-scheme:dark;--ground:#0a0a0b;--ink:#e9e5de;--ink-2:#b6b1a8;--ink-3:#8c877f;--ink-4:#5f5b55;--rule-2:rgba(233,229,222,.18);--wash:rgba(233,229,222,.06);--f-ui:Inter,system-ui,sans-serif}
body{margin:0;padding:48px;background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--f-ui)}
h1{font:400 40px/1 Newsreader,serif;margin:0 0 40px}h2{font:400 25px/1.2 Newsreader,serif;margin:0 0 20px}small{font:12px var(--f-ui);color:var(--ink-3);border:1px dashed var(--ink-4);padding:2px 6px;border-radius:4px}
section{padding:32px 0 48px;border-top:1px solid var(--rule-2)}.pair{display:flex;gap:56px;align-items:flex-start;flex-wrap:wrap}
figure{margin:0}figcaption{margin-top:14px;max-width:46em;font-size:13px;color:var(--ink-3)}.p{padding:8px;outline:1px dashed var(--ink-4)}
.il{display:block;overflow:visible;font-family:var(--f-ui, "Inter", "Inter Fallback", system-ui, sans-serif);--il-accent:var(--log, #8fb8ff)}
.il .il-hair{fill:none;stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-line{fill:none;stroke:var(--ink-3, #8c877f);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.il .il-line.il-a{stroke:var(--il-accent)}
.il .il-line.il-dash{stroke-dasharray:1 5;stroke:var(--ink-4, #5f5b55)}
.il .il-box{fill:var(--wash, rgba(233, 229, 222, 0.06));stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-box.il-a{fill:color-mix(in srgb,var(--il-accent) 9%,transparent);stroke:var(--il-accent);stroke-width:1.5}
.il .il-box.il-dash{fill:none;stroke:var(--ink-4, #5f5b55);stroke-dasharray:3 4}
.il .il-dot{fill:var(--il-accent)}
.il .il-ring{fill:none;stroke:var(--il-accent);stroke-width:1.5}
.il .il-dot.il-later{fill:var(--ground, #0a0a0b);stroke:var(--ink-4, #5f5b55);stroke-width:1.5}
.il .il-bar{fill:var(--ink-4, #5f5b55)}
.il .il-bar.il-a{fill:var(--il-accent)}
.il .il-hand{fill:var(--il-accent)}
.il .il-frame{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:1}
.il .il-label{font:400 13px/1 var(--f-ui, "Inter", "Inter Fallback", system-ui, sans-serif);fill:var(--ink-3, #8c877f);letter-spacing:0.005em}
.il .il-name{font:500 15px/1 var(--f-ui, "Inter", "Inter Fallback", system-ui, sans-serif);fill:var(--ink, #e9e5de);letter-spacing:0}
.il .il-note{font:400 15px/1 var(--f-ui, "Inter", "Inter Fallback", system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);letter-spacing:0}
.il .il-num{font:400 13px/1 var(--f-ui, "Inter", "Inter Fallback", system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);font-variant-numeric:tabular-nums;letter-spacing:0.005em}
.il .il-a-text{fill:var(--il-accent)}
.il .il-knock{paint-order:stroke;stroke:var(--ground, #0a0a0b);stroke-width:6px;stroke-linejoin:round}
.il.il-plate{pointer-events:none}</style><h1>Illustration kit</h1><section><h2>How a log entry is made</h2>
<div class="pair"><figure><svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" aria-labelledby="entry-flow-wide-t entry-flow-wide-d" class="il" focusable="false" role="img" style="--il-accent:var(--log, #8fb8ff)" viewBox="0 0 720 160"><title id="entry-flow-wide-t">How a log entry is made</title><desc id="entry-flow-wide-d">Four steps from left to right: dictated notes, a draft, the owner&apos;s review, and the published entry. A loop runs from the review back to the draft, labelled &quot;changes&quot;.</desc><rect width="144" height="64" x="0" y="16" class="il-box" rx="6"/><text x="72" y="45" class="il-name" text-anchor="middle">Dictated notes</text><text x="72" y="63" class="il-label" text-anchor="middle">raw, often Turkish</text><rect width="144" height="64" x="192" y="16" class="il-box" rx="6"/><text x="264" y="45" class="il-name" text-anchor="middle">Draft</text><text x="264" y="63" class="il-label" text-anchor="middle">edited into English</text><rect width="144" height="64" x="384" y="16" class="il-box il-a" rx="6"/><text x="456" y="45" class="il-name" text-anchor="middle">Review</text><text x="456" y="63" class="il-label" text-anchor="middle">I read every draft</text><rect width="144" height="64" x="576" y="16" class="il-box" rx="6"/><text x="648" y="45" class="il-name" text-anchor="middle">Published</text><text x="648" y="63" class="il-label" text-anchor="middle">dated, in the log</text><path d="M150 48h36m-3.71-3.71L186 48l-3.71 3.71M342 48h36m-3.71-3.71L378 48l-3.71 3.71" class="il-line"/><path d="M534 48h36m-3.71-3.71L570 48l-3.71 3.71" class="il-line il-a"/><path d="M456 86v34q0 8-8 8H272q-8 0-8-8V86" class="il-line"/><path d="M260.29 89.71 264 86l3.71 3.71" class="il-line"/><text x="360" y="146" class="il-label il-knock" text-anchor="middle">changes</text></svg><figcaption>Every entry passes the same gate: nothing is published before I have read it.</figcaption></figure><figure class="n"><svg xmlns="http://www.w3.org/2000/svg" width="288" height="336" aria-labelledby="entry-flow-narrow-t entry-flow-narrow-d" class="il" focusable="false" role="img" style="--il-accent:var(--log, #8fb8ff)" viewBox="0 0 288 336"><title id="entry-flow-narrow-t">How a log entry is made</title><desc id="entry-flow-narrow-d">Four steps from left to right: dictated notes, a draft, the owner&apos;s review, and the published entry. A loop runs from the review back to the draft, labelled &quot;changes&quot;.</desc><rect width="184" height="56" x="0" y="8" class="il-box" rx="6"/><text x="92" y="33" class="il-name" text-anchor="middle">Dictated notes</text><text x="92" y="51" class="il-label" text-anchor="middle">raw, often Turkish</text><rect width="184" height="56" x="0" y="96" class="il-box" rx="6"/><text x="92" y="121" class="il-name" text-anchor="middle">Draft</text><text x="92" y="139" class="il-label" text-anchor="middle">edited into English</text><rect width="184" height="56" x="0" y="184" class="il-box il-a" rx="6"/><text x="92" y="209" class="il-name" text-anchor="middle">Review</text><text x="92" y="227" class="il-label" text-anchor="middle">I read every draft</text><rect width="184" height="56" x="0" y="272" class="il-box" rx="6"/><text x="92" y="297" class="il-name" text-anchor="middle">Published</text><text x="92" y="315" class="il-label" text-anchor="middle">dated, in the log</text><path d="M92 70v20m3.71-3.71L92 90l-3.71-3.71M92 158v20m3.71-3.71L92 178l-3.71-3.71" class="il-line"/><path d="M92 246v20m3.71-3.71L92 266l-3.71-3.71" class="il-line il-a"/><path d="M190 212h10q8 0 8-8v-72q0-8-8-8h-10" class="il-line"/><path d="M193.71 127.71 190 124l3.71-3.71" class="il-line"/><text x="216" y="172" class="il-label">changes</text></svg></figure><figure class="p"><svg xmlns="http://www.w3.org/2000/svg" width="96" height="56" aria-hidden="true" class="il il-plate" focusable="false" style="--il-accent:var(--log, #8fb8ff)" viewBox="0 0 96 56"><rect width="24" height="18" x="4" y="18.5" class="il-box" rx="4"/><rect width="24" height="18" x="36" y="18.5" class="il-box il-a" rx="4"/><rect width="24" height="18" x="68" y="18.5" class="il-box" rx="4"/><path d="M30 27.5h4" class="il-line"/><path d="M62 27.5h4" class="il-line il-a"/></svg></figure></div></section>

<section><h2>Sample chart: entries per month <small>sample</small></h2>
