<svg xmlns="http://www.w3.org/2000/svg" width="358" height="336" aria-labelledby="entry-flow-narrow-t entry-flow-narrow-d" class="il" focusable="false" role="img" style="--il-accent:var(--log, #8fb8ff)" viewBox="0 0 358 336"><title id="entry-flow-narrow-t">How a log entry is made</title><desc id="entry-flow-narrow-d">Four steps from left to right: dictated notes, a draft, the owner&apos;s review, and the published entry. A loop runs from the review back to the draft, labelled &quot;changes&quot;.</desc><style>.il{display:block;overflow:visible;font-family:var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);--il-accent:var(--log, #8fb8ff)}
.il .il-hair{fill:none;stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-line{fill:none;stroke:var(--ink-3, #8c877f);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.il .il-line.il-a{stroke:var(--il-accent)}
.il .il-line.il-dash{stroke-dasharray:1 5;stroke:var(--ink-4, #5f5b55)}
.il .il-box{fill:var(--wash, rgba(233, 229, 222, 0.06));stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-box.il-a{fill:color-mix(in srgb,var(--il-accent) 9%,transparent);stroke:var(--il-accent);stroke-width:1.5}
.il .il-box.il-dash{fill:none;stroke:var(--ink-4, #5f5b55);stroke-dasharray:3 4}
.il .il-dot{fill:var(--il-accent)}
.il .il-ring{fill:none;stroke:var(--il-accent);stroke-width:1.5}
.il .il-dot.il-later{fill:var(--ground, #0a0a0b);stroke:var(--ink-4, #5f5b55);stroke-width:1.5}
.il .il-bar{fill:var(--ink-4, #5f5b55)}
.il .il-bar.il-a{fill:var(--il-accent)}
.il .il-hand{fill:var(--il-accent)}
.il .il-frame{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:1}
.il .il-label{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-3, #8c877f);letter-spacing:0.005em}
.il .il-name{font:500 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink, #e9e5de);letter-spacing:0}
.il .il-note{font:400 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);letter-spacing:0}
.il .il-num{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);font-variant-numeric:tabular-nums;letter-spacing:0.005em}
.il .il-a-text{fill:var(--il-accent)}
.il .il-knock{paint-order:stroke;stroke:var(--ground, #0a0a0b);stroke-width:6px;stroke-linejoin:round}
.il.il-plate{pointer-events:none}</style><rect width="232" height="56" x="0" y="8" class="il-box" rx="6"/><text x="116" y="33" class="il-name" text-anchor="middle">Dictated notes</text><text x="116" y="51" class="il-label" text-anchor="middle">raw, often Turkish</text><rect width="232" height="56" x="0" y="96" class="il-box" rx="6"/><text x="116" y="121" class="il-name" text-anchor="middle">Draft</text><text x="116" y="139" class="il-label" text-anchor="middle">edited into English</text><rect width="232" height="56" x="0" y="184" class="il-box il-a" rx="6"/><text x="116" y="209" class="il-name" text-anchor="middle">Review</text><text x="116" y="227" class="il-label" text-anchor="middle">I read every draft</text><rect width="232" height="56" x="0" y="272" class="il-box" rx="6"/><text x="116" y="297" class="il-name" text-anchor="middle">Published</text><text x="116" y="315" class="il-label" text-anchor="middle">dated, in the log</text><path d="M116 70v20m3.71-3.71L116 90l-3.71-3.71M116 158v20m3.71-3.71L116 178l-3.71-3.71" class="il-line"/><path d="M116 246v20m3.71-3.71L116 266l-3.71-3.71" class="il-line il-a"/><path d="M238 212h18q8 0 8-8v-72q0-8-8-8h-18" class="il-line"/><path d="M241.71 127.71 238 124l3.71-3.71" class="il-line"/><text x="272" y="172" class="il-label">changes</text></svg>
