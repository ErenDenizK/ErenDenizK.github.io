<svg xmlns="http://www.w3.org/2000/svg" width="720" height="124" aria-labelledby="levels-wide-t levels-wide-d" class="il" focusable="false" role="img" style="--il-accent:var(--log, #8fb8ff)" viewBox="0 0 720 124"><title id="levels-wide-t">The site grows level by level</title><desc id="levels-wide-d">A line from October 2026 to year five. Level 0, foundation, is done; Level 1, concept prototypes, is current and circled by hand; Level 2, the content site, and Level 3, the world, are still ahead, on a dotted line.</desc><style>.il{display:block;overflow:visible;font-family:var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);--il-accent:var(--log, #8fb8ff)}
.il .il-hair{fill:none;stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-line{fill:none;stroke:var(--ink-3, #8c877f);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.il .il-line.il-a{stroke:var(--il-accent)}
.il .il-line.il-dash{stroke-dasharray:1 5;stroke:var(--ink-4, #5f5b55)}
.il .il-box{fill:var(--wash, rgba(233, 229, 222, 0.06));stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-box.il-a{fill:color-mix(in srgb,var(--il-accent) 9%,transparent);stroke:var(--il-accent);stroke-width:1.5}
.il .il-box.il-dash{fill:none;stroke:var(--ink-4, #5f5b55);stroke-dasharray:3 4}
.il .il-dot{fill:var(--il-accent)}
.il .il-ring{fill:none;stroke:var(--il-accent);stroke-width:1.5}
.il .il-dot.il-later{fill:var(--ground, #0a0a0b);stroke:var(--ink-4, #5f5b55);stroke-width:1.5}
.il .il-bar{fill:var(--ink-4, #5f5b55)}
.il .il-bar.il-a{fill:var(--il-accent)}
.il .il-hand{fill:var(--il-accent)}
.il .il-frame{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:1}
.il .il-label{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-3, #8c877f);letter-spacing:0.005em}
.il .il-name{font:500 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink, #e9e5de);letter-spacing:0}
.il .il-note{font:400 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);letter-spacing:0}
.il .il-num{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);font-variant-numeric:tabular-nums;letter-spacing:0.005em}
.il .il-a-text{fill:var(--il-accent)}
.il .il-knock{paint-order:stroke;stroke:var(--ground, #0a0a0b);stroke-width:6px;stroke-linejoin:round}
.il.il-plate{pointer-events:none}</style><path d="M8 48h197" class="il-line"/><path d="M205 48h507" class="il-line il-dash"/><text x="8" y="32" class="il-label">Oct 2026</text><text x="712" y="32" class="il-label" text-anchor="end">Year five</text><circle cx="8" cy="48" r="4" class="il-dot"/><text x="8" y="80" class="il-name">Level 0</text><text x="8" y="102" class="il-label">Foundation</text><circle cx="205.12" cy="48" r="8" class="il-ring"/><circle cx="205.12" cy="48" r="4" class="il-dot"/><text x="205.12" y="80" class="il-name" text-anchor="middle">Level 1</text><text x="205.12" y="102" class="il-label" text-anchor="middle">Concept prototypes</text><circle cx="388.16" cy="48" r="4" class="il-dot il-later"/><text x="388.16" y="80" class="il-name" text-anchor="middle">Level 2</text><text x="388.16" y="102" class="il-label" text-anchor="middle">The content site</text><circle cx="571.2" cy="48" r="4" class="il-dot il-later"/><text x="571.2" y="80" class="il-name" text-anchor="middle">Level 3</text><text x="571.2" y="102" class="il-label" text-anchor="middle">The world</text><path d="m174.5 85.37 2.8.36q2.79.36 5.2.34 2.42-.01 4.74-.13 2.33-.12 4.63-.25 2.29-.14 4.58-.2 2.29-.07 4.55-.23 2.25-.16 4.55-.14 2.3.03 4.57.08t4.49-.18q2.23-.23 4.5-.41 2.28-.17 4.6-.02 2.31.15 4.54.06t5.88-.44 3.77-.35q.11.01.22.06.11.04.2.12.09.07.14.18.06.1.09.21.02.12.01.23-.02.12-.07.22-.05.11-.13.19-.08.09-.18.14-.11.05-.22.07-.12.02-.24 0-.11-.02-.21-.08-.11-.05-.19-.14t-.12-.19q-.05-.11-.06-.23-.01-.11.01-.23.03-.11.09-.21t.15-.17q.09-.08.2-.12t.23-.05q.12 0 .23.03t.21.1q.09.07.16.16.07.1.11.21.03.11.03.22 0 .12-.04.23t-.11.21q-.07.09-.17.15-.1.07-.21.1l-.11.03-3.69.35q-3.69.36-6 .45-2.3.09-4.52-.06-2.21-.15-4.47.03t-4.57.42q-2.31.23-4.57.19-2.27-.04-4.5-.06-2.24-.02-4.52.16-2.29.17-4.55.26-2.27.08-4.57.24-2.3.15-4.66.31-2.36.15-4.89.21-2.52.06-5.33-.24-2.8-.3-2.91-.32-.11-.03-.21-.08-.11-.06-.19-.13-.09-.08-.15-.17-.07-.1-.11-.2-.04-.11-.06-.23-.01-.11 0-.22.02-.12.06-.23.04-.1.1-.2.