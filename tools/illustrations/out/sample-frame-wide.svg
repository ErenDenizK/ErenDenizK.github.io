<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" aria-labelledby="sample-frame-wide-t sample-frame-wide-d" class="il" focusable="false" role="img" style="--il-accent:var(--log, #8fb8ff)" viewBox="0 0 720 316"><title id="sample-frame-wide-t">Annotated screenshot of the log index</title><desc id="sample-frame-wide-d">A crop of prototype F&apos;s log page with three notes: the date gutter, the entry kind, and the sample tag.</desc><style>.il{display:block;overflow:visible;font-family:var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);--il-accent:var(--log, #8fb8ff)}
.il .il-hair{fill:none;stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-line{fill:none;stroke:var(--ink-3, #8c877f);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.il .il-line.il-a{stroke:var(--il-accent)}
.il .il-line.il-dash{stroke-dasharray:1 5;stroke:var(--ink-4, #5f5b55)}
.il .il-box{fill:var(--wash, rgba(233, 229, 222, 0.06));stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-box.il-a{fill:color-mix(in srgb,var(--il-accent) 9%,transparent);stroke:var(--il-accent);stroke-width:1.5}
.il .il-box.il-dash{fill:none;stroke:var(--ink-4, #5f5b55);stroke-dasharray:3 4}
.il .il-dot{fill:var(--il-accent)}
.il .il-ring{fill:none;stroke:var(--il-accent);stroke-width:1.5}
.il .il-dot.il-later{fill:var(--ground, #0a0a0b);stroke:var(--ink-4, #5f5b55);stroke-width:1.5}
.il .il-bar{fill:var(--ink-4, #5f5b55)}
.il .il-bar.il-a{fill:var(--il-accent)}
.il .il-hand{fill:var(--il-accent)}
.il .il-frame{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:1}
.il .il-label{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-3, #8c877f);letter-spacing:0.005em}
.il .il-name{font:500 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink, #e9e5de);letter-spacing:0}
.il .il-note{font:400 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);letter-spacing:0}
.il .il-num{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);font-variant-numeric:tabular-nums;letter-spacing:0.005em}
.il .il-a-text{fill:var(--il-accent)}
.il .il-knock{paint-order:stroke;stroke:var(--ground, #0a0a0b);stroke-width:6px;stroke-linejoin:round}
.il.il-plate{pointer-events:none}</style><clipPath id="sf-w-clip"><rect width="480" height="300" x="120" y="8" rx="8"/></clipPath><image width="480" height="300" x="120" y="8" clip-path="url(#sf-w-clip)" href="../../../prototypes/f/shots/desktop-log.png" preserveAspectRatio="xMidYMin slice"/><rect width="479" height="299" x="120.5" y="8.5" class="il-frame" rx="8"/><path d="M144 188h-40" class="il-hair" style="stroke:var(--ink-3, #8c877f)"/><circle cx="144" cy="188" r="4" class="il-dot"/><text x="96" y="192" class="il-note" text-anchor="end">Date gutter</text><path d="M248.64 162H616" class="il-hair" style="stroke:var(--ink-3, #8c877f)"/><circle cx="248.64" cy="161.9" r="4" class="il-dot"/><text x="624" y="165.9" class="il-note">Sample tag</text><path d="M369.6 188H616" class="il-hair" style="stroke:var(--ink-3, #8c877f)"/><circle cx="369.6" cy="188" r="4" class="il-dot"/><text x="624" y="192" class="il-note">Entry kind</text><path d="m357.76 175.45 2.11-.48q2.11-.47 4.03-.91t3.9-.57q1.99-.13 3.93-.11t3.81.27q1.88.24 3.69.56t3.58.73 3.31 1.05q1.55.64 2.9 1.37t2.72 1.46q1.36.74 2.4 1.66t1.92 1.87q.87.95 1.48 2.06.62 1.1.67 2.34.05 1.23.02 2.31-.02 1.08-.59 2.28-.57 1.21-1.16 2.23-.58 1.03-1.63 2.05-1.04 1.01-2.18 1.91-1.14.89-2.7 1.61-1.55.72-3.31 1.21-1.76.5-3.37 1.08t-3.55.86q-1.95.27-3.84.56-1.9.29-3.91.34-2.01.04-3.97-.15t-3.9-.42q-1.93-.24-3.69-.76-1.76-.51-3.44-1.06-1.69-.54-3.32-1.17-1.63-.62-2.84-1.5-1.22-.88-2.26-1.77-1.03-.89-2.03-1.8-1-.92-1.84-1.95-.85-1.04-1.22-2.23-.37-1.2-.44-2.38-.06-1.18.18-2.38t.93-2.38 1.62-2.21q.94-1.04 2.32-1.92 1.38-.87 2.7-1.66 1.31-.78 2.85-1.49t3.22-1.33 3.62-.98 3.9-.6q1.96-.25 3.97-.36 2.01-.1 5.28-.05 3.26.05 3.38.07t.23.08.19.15.13.2.06.24q.02.12-.01.24t-.09.22q-.07.1-.16.18-.1.08-.21.12-.12.05-.24.05-.12.01-.24-.03-.12-.03-.22-.1t-.17-.17-.11-.22q-.04-.11-.03-.23 0-.13.04-.24.04-.12.11-.21.08-.1.18-.17.1-.06.22-.1.12-.03.24-.02.13.01.24.06.11.04.2.12.1.09.16.19.06.11.08.23.03.12.01.24-.01.12-.07.23-.05.11-.13.2-.09.09-.2.