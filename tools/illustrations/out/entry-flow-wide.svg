<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" aria-labelledby="entry-flow-wide-t entry-flow-wide-d" class="il" focusable="false" role="img" style="--il-accent:var(--log, #8fb8ff)" viewBox="0 0 720 160"><title id="entry-flow-wide-t">How a log entry is made</title><desc id="entry-flow-wide-d">Four steps from left to right: dictated notes, a draft, the owner&apos;s review, and the published entry. A loop runs from the review back to the draft, labelled &quot;changes&quot;.</desc><style>.il{display:block;overflow:visible;font-family:var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);--il-accent:var(--log, #8fb8ff)}
.il .il-hair{fill:none;stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-line{fill:none;stroke:var(--ink-3, #8c877f);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.il .il-line.il-a{stroke:var(--il-accent)}
.il .il-line.il-dash{stroke-dasharray:1 5;stroke:var(--ink-4, #5f5b55)}
.il .il-box{fill:var(--wash, rgba(233, 229, 222, 0.06));stroke:var(--rule-2, rgba(233, 229, 222, 0.18));stroke-width:1}
.il .il-box.il-a{fill:color-mix(in srgb,var(--il-accent) 9%,transparent);stroke:var(--il-accent);stroke-width:1.5}
.il .il-box.il-dash{fill:none;stroke:var(--ink-4, #5f5b55);stroke-dasharray:3 4}
.il .il-dot{fill:var(--il-accent)}
.il .il-ring{fill:none;stroke:var(--il-accent);stroke-width:1.5}
.il .il-dot.il-later{fill:var(--ground, #0a0a0b);stroke:var(--ink-4, #5f5b55);stroke-width:1.5}
.il .il-bar{fill:var(--ink-4, #5f5b55)}
.il .il-bar.il-a{fill:var(--il-accent)}
.il .il-hand{fill:var(--il-accent)}
.il .il-frame{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:1}
.il .il-label{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-3, #8c877f);letter-spacing:0.005em}
.il .il-name{font:500 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink, #e9e5de);letter-spacing:0}
.il .il-note{font:400 15px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);letter-spacing:0}
.il .il-num{font:400 13px/1 var(--f-ui, &quot;Inter&quot;, &quot;Inter Fallback&quot;, system-ui, sans-serif);fill:var(--ink-2, #b6b1a8);font-variant-numeric:tabular-nums;letter-spacing:0.005em}
.il .il-a-text{fill:var(--il-accent)}
.il .il-knock{paint-order:stroke;stroke:var(--ground, #0a0a0b);stroke-width:6px;stroke-linejoin:round}
.il.il-plate{pointer-events:none}</style><rect width="144" height="64" x="0" y="16" class="il-box" rx="6"/><text x="72" y="45" class="il-name" text-anchor="middle">Dictated notes</text><text x="72" y="63" class="il-label" text-anchor="middle">raw, often Turkish</text><rect width="144" height="64" x="192" y="16" class="il-box" rx="6"/><text x="264" y="45" class="il-name" text-anchor="middle">Draft</text><text x="264" y="63" class="il-label" text-anchor="middle">edited into English</text><rect width="144" height="64" x="384" y="16" class="il-box il-a" rx="6"/><text x="456" y="45" class="il-name" text-anchor="middle">Review</text><text x="456" y="63" class="il-label" text-anchor="middle">I read every draft</text><rect width="144" height="64" x="576" y="16" class="il-box" rx="6"/><text x="648" y="45" class="il-name" text-anchor="middle">Published</text><text x="648" y="63" class="il-label" text-anchor="middle">dated, in the log</text><path d="M150 48h36m-3.71-3.71L186 48l-3.71 3.71M342 48h36m-3.71-3.71L378 48l-3.71 3.71" class="il-line"/><path d="M534 48h36m-3.71-3.71L570 48l-3.71 3.71" class="il-line il-a"/><path d="M456 86v34q0 8-8 8H272q-8 0-8-8V86" class="il-line"/><path d="M260.29 89.71 264 86l3.71 3.71" class="il-line"/><text x="360" y="146" class="il-label il-knock" text-anchor="middle">changes</text></svg>
